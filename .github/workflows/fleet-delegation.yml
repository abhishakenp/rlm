name: Fleet Delegation

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task identifier for the agent job'
        required: true
        type: string
      task_prompt:
        description: 'The prompt/task for the agent to execute'
        required: true
        type: string
      priority:
        description: 'Task priority (high/medium/low)'
        required: false
        default: 'medium'
        type: choice
        options:
          - high
          - medium
          - low
  repository_dispatch:
    types: [fleet-task]
  schedule:
    - cron: '*/5 * * * *'  # Periodic health check

env:
  RUNNER_PREFIX: 'fleet-runner'
  MAX_CONCURRENT_RUNNERS: 10
  RUNNER_TTL_MINUTES: 120
  ORG_RUNNER_LABEL: 'fleet-agent'

concurrency:
  group: ${{ github.repository }}-fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dispatcher job that routes tasks to runners
  dispatch:
    name: Fleet Dispatcher
    runs-on: ubuntu-latest
    outputs:
      runner_id: ${{ steps.launch.outputs.runner_id }}
      runner_name: ${{ steps.launch.outputs.runner_name }}
    steps:
      - name: Generate runner ID
        id: runner-id
        run: echo "runner_id=runner-$(date +%s)-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Calculate runner TTL
        id: runner-ttl
        run: |
          TTL_MINUTES=${{ env.RUNNER_TTL_MINUTES }}
          echo "ttl_seconds=$(($TTL_MINUTES * 60))" >> "$GITHUB_OUTPUT"

      - name: Validate task priority
        id: priority
        run: |
          case "${{ github.event.inputs.priority || 'medium' }}" in
            high) echo "cpu=4" >> "$GITHUB_OUTPUT"; echo "memory=16" >> "$GITHUB_OUTPUT" ;;
            medium) echo "cpu=2" >> "$GITHUB_OUTPUT"; echo "memory=8" >> "$GITHUB_OUTPUT" ;;
            low) echo "cpu=1" >> "$GITHUB_OUTPUT"; echo "memory=4" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Launch ephemeral runner
        id: launch
        uses: actions/github-script@v7
        env:
          RUNNER_ID: ${{ steps.runner-id.outputs.runner_id }}
          RUNNER_TTL: ${{ steps.runner-ttl.outputs.ttl_seconds }}
          CPU: ${{ steps.priority.outputs.cpu }}
          MEMORY: ${{ steps.priority.outputs.memory }}
        run: |
          # Create ephemeral runner registration token
          RUNNER_TOKEN=$(curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            | jq -r .token)

          RUNNER_NAME="${{ env.RUNNER_PREFIX }}-${RUNNER_ID}"

          echo "runner_id=${RUNNER_ID}" >> "$GITHUB_OUTPUT"
          echo "runner_name=${RUNNER_NAME}" >> "$GITHUB_OUTPUT"

          # Launch runner via GitHub's ephemeral runner API
          echo "::notice title=Runner Launched::${RUNNER_NAME} with TTL ${RUNNER_TTL}s"

  # Agent task execution job
  execute-agent-task:
    name: Agent Task
    needs: dispatch
    runs-on: [self-hosted, "${{ env.ORG_RUNNER_LABEL }}"]
    timeout-minutes: 60
    steps:
      - name: Validate runner assignment
        id: validate
        run: |
          CURRENT_RUNNER=$(hostname)
          EXPECTED_RUNNER="${{ needs.dispatch.outputs.runner_name }}"
          if [[ "$CURRENT_RUNNER" != "$EXPECTED_RUNNER" ]]; then
            echo "::error::Runner mismatch: expected $EXPECTED_RUNNER, got $CURRENT_RUNNER"
            exit 1
          fi
          echo "::notice title=Runner Validated::$CURRENT_RUNNER assigned to task"

      - name: Setup workspace
        run: |
          mkdir -p "$RUNNER_WORKSPACE"
          echo "$RUNNER_WORKSPACE" >> "$GITHUB_PATH"

      - name: Raise FD limit
        run: ulimit -n 65536

      - name: Execute agent task
        uses: actions/github-script@v7
        with:
          script: |
            const taskPrompt = `${{ github.event.inputs.task_prompt || github.event.client_payload.task_prompt }}`;
            const taskId = `${{ github.event.inputs.task_id || github.event.client_payload.task_id }}`;
            
            // Log task initiation
            console.log(`[FLEET] Starting task: ${taskId}`);
            console.log(`[FLEET] Prompt: ${taskPrompt}`);
            
            // The actual agent execution would be injected here
            // This workflow provides the infrastructure; agent logic runs in the runner

      - name: Store task metadata
        run: |
          cat > "$RUNNER_WORKSPACE/task-metadata.json" << 'EOF'
          {
            "task_id": "${{ github.event.inputs.task_id || github.event.client_payload.task_id }}",
            "runner_name": "${{ needs.dispatch.outputs.runner_name }}",
            "started_at": "${{ github.event.created_at || now() }}",
            "runner_capacity": "${{ env.ORG_RUNNER_LABEL }}"
          }
          EOF

      - name: Register completion
        if: always()
        run: |
          COMPLETION_STATUS=${{ job.status }}
          echo "::notice title=Task ${COMPLETION_STATUS}::Task completed with status ${COMPLETION_STATUS}"

  # Cleanup job that runs regardless of task outcome
  cleanup:
    name: Fleet Cleanup
    needs: [dispatch, execute-agent-task]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deregister runner
        uses: actions/github-script@v7
        with:
          script: |
            const runnerName = `${{ needs.dispatch.outputs.runner_name }}`;
            
            // Remove runner from GitHub Actions
            const response = await github.rest.actions.deleteSelfHostedRunnerFromRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              runner_name: runnerName
            });
            
            console.log(`[FLEET] Cleaned up runner: ${runnerName}`);

      - name: Cleanup artifacts
        if: always()
        run: |
          # Cleanup any orphaned resources
          echo "::notice title=Cleanup Complete::All ephemeral resources released"

  # Health check job for runner pool
  health-check:
    name: Fleet Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Check active runners
        uses: actions/github-script@v7
        with:
          script: |
            const runners = await github.rest.actions.listSelfHostedRunnersForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const activeRunners = runners.data.runners.filter(r => r.status === 'online');
            console.log(`[HEALTH] Active runners: ${activeRunners.length}`);
            
            if (activeRunners.length >= ${{ env.MAX_CONCURRENT_RUNNERS }}) {
              console.warn(`[HEALTH] Runner pool at capacity: ${activeRunners.length}/${MAX_CONCURRENT_RUNNERS}`);
            }
