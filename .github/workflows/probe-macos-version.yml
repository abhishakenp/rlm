name: macOS Version Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: System Info
        run: |
          echo "=== sw_vers ==="
          sw_vers
          echo ""
          echo "=== uname -a ==="
          uname -a
          echo ""
          echo "=== Xcode Info ==="
          xcode-select -p && xcodebuild -version
