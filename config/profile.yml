# rlm profile — Cordis entry-list composing all plugins.
#
# Five plugins, all hot-swappable via HMR:
#   1. Context — persistent typed variable registry (agent working memory)
#   2. Code — persistent JS code execution (replaces bash + edit)
#   3. SDK — in-process subagent spawning (wraps coding-agent runtime)
#   4. Workflow — hot-swappable TS workflows from ~/.prime/agent/workflows/
#   5. Learn — self-evolution (tracks outcomes, proposes modifications)
#
# Order matters: Context must load first so the context service is
# available when Code injects it into the VM context. Code must load
# before SDK so the code service is available when SDK spawns subagents.

- id: context
  name: './packages/rlm-context/src/index.ts'
  config:
    projectRoot: .

- id: code
  name: './packages/rlm-code/src/index.ts'
  config:
    timeout: 60000
    maxOutputChars: 65536

- id: sdk
  name: './packages/rlm-sdk/src/index.ts'
  config:
    maxDepth: 10
    defaultModel: auto/best-free

- id: workflow
  name: './packages/rlm-workflow/src/index.ts'
  config:
    workflowsDir: ~/.prime/agent/workflows

- id: learn
  name: './packages/rlm-learn/src/index.ts'
  config:
    reflectInterval: 60000
    maxLearningsBeforeReflect: 10
