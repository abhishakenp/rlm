# rlm — the application, as data.
#
# This file IS rlm. Every capability is a row; there is no privileged core and
# no row that needs a restart to change. Load order comes from what each row
# injects, never from position here — position is for reading.
#
#   Recording      log
#   Boot           boot                    where things are, the overlay, shutdown
#   Reload         timer, hmr, rlm-hmr
#   Foundation     config, context, tui, prompt
#   Self-extension compose, plugins, self  rlm's hands on this file
#   Core           session, tools, refine, code, workflow, learn, gitpixel
#   Agent          agent                   the LLM loop
#   Presentation   renderer, print, sdk, modes
#
# The user's overlay is `~/.rlm/cordis.patch.yml`, layered over this file by the
# `boot` row and re-applied whenever it changes. Everything rlm decides about
# itself is written there and nowhere else, so `git diff` on this file only ever
# shows what a person did, and deleting the overlay returns rlm to stock.
#
# ## Hot reload, accurately
#
# `fiber.restart()` is NOT the mechanism, and three places in this repo used to
# say it was. It re-runs the plugin callback against the *cached* module, so a
# source edit has no effect. What actually happens is
# `registry.delete(oldPlugin)` followed by `registry.plugin(newPlugin,
# oldFiber._config)` for each live fiber, after the changed modules and
# everything downstream of them have been evicted from Node's ESM load cache.
# `@deepseek-ai/cordis-plugin-hmr` does that; `rlm-hmr` adds what it does not —
# watching the resource directories (skills, extensions, prompts, workflows)
# that live outside the module graph, and translating a reload into the events a
# live AgentSession listens for.
#
# Two fibers of one row therefore coexist for as long as the old disposer takes.
# That is what lets in-flight work finish, and it is why anything singleton — a
# port, a lock, a sidecar — has to be acquired inside `ctx.effect()`.

# ─── Recording ───────────────────────────────────────────────────────────────
#
# First row of all: everything after it can be explained from the log, and a
# failure during boot is exactly the one you cannot reproduce on demand.

- id: log
  name: './packages/rlm-log/src/index.ts'
  config:
    level: info

# ─── Boot ────────────────────────────────────────────────────────────────────
#
# Second, because everything below it wants to know where the repo and the
# home directory are, and because the overlay it layers on top of this file has
# to be in place before rows start reading their own config. `cordis-shell.mjs`
# used to do all of this; a bug in any of it therefore cost a restart, which is
# the one thing rlm is not allowed to need in order to change itself.

- id: boot
  name: './packages/rlm-boot/src/index.ts'

# ─── Reload ──────────────────────────────────────────────────────────────────
#
# First rows on purpose: reload is itself a fiber, so editing a plugin reloads
# it. `hmr` is the upstream plugin DSH declares in its own base composition —
# it traces Node's module graph, clears the affected caches and swaps only the
# plugin entries that depend on what changed. `rlm-hmr` adds the two things it
# does not do: it watches the agent's resource directories (skills, extensions,
# prompts, workflows live outside the repo and are not modules) and translates
# reload announcements into the events a live AgentSession listens for. With no
# official plugin present — under bun, or without --expose-internals — rlm-hmr
# reloads modules itself instead.

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  config:
    root: ['packages']
    ignored: ['**/node_modules', '**/dist', '**/.*']
    debounce: 100

- id: rlm-hmr
  name: './packages/rlm-hmr/src/index.ts'
  config:
    roots: ['packages']
    debounce: 100

# ─── Foundation ──────────────────────────────────────────────────────────────

- id: config
  name: './packages/rlm-config/src/index.ts'
  config:
    cwd: .

- id: context
  name: './packages/rlm-context/src/index.ts'
  config:
    projectRoot: .

- id: tui
  name: './packages/rlm-tui/src/index.ts'

- id: prompt
  name: './packages/rlm-prompt/src/index.ts'

# ─── Self-extension ──────────────────────────────────────────────────────────
#
# The three rows that make this file writable by the thing it composes.
# `compose` reads the composition and writes the overlay; `plugins` scaffolds a
# package, mounts it, and refuses to call a row that did not start "mounted";
# `self` is the seam that puts both in reach of a code cell, as `self.*`.
#
# They are three rows and not one because the capability and the surface it is
# offered through are different concerns: a second surface (a slash command, a
# socket) is a new row beside `self`, not an edit to `plugins`.

- id: compose
  name: './packages/rlm-compose/src/index.ts'

- id: plugins
  name: './packages/rlm-plugins/src/index.ts'
  config:
    staleAfterMinutes: 30
    rollbackOnFailure: true
    mountTimeout: 4000

- id: self
  name: './packages/rlm-self/src/index.ts'

# ─── Core ────────────────────────────────────────────────────────────────────

- id: session
  name: './packages/rlm-session/src/index.ts'

- id: tools
  name: './packages/rlm-tools/src/index.ts'
  config:
    timeout: 60000
    maxOutputChars: 65536

- id: refine
  name: './packages/rlm-refine/src/index.ts'

- id: code
  name: './packages/rlm-code/src/index.ts'
  config:
    timeout: 60000
    maxOutputChars: 65536

- id: workflow
  name: './packages/rlm-workflow/src/index.ts'
  config:
    workflowsDir: ~/.rlm/agent/workflows

# The delegation loop's memory. Above `workflow` in reading order because the
# workflow that does the delegating asks this row for the list first: what was
# asked is written down before any of it is attempted, and it is still written
# down after the process that was attempting it has gone. Load order still comes
# from `inject` — this row injects nothing, so it is up early either way.
#
# It also contributes two prompt fragments, both read from disk when the prompt
# is built rather than at mount: what is still owed, and the current source of
# the delegator workflow itself.
- id: delegate
  name: './packages/rlm-delegate/src/index.ts'
  config:
    # concurrency is deliberately absent: left unset, the limit is measured from
    # this machine between tasks — descriptors first, since that is what wedged
    # it — and anything over the limit waits in the journal instead of being
    # refused. Set it to a number to pin it.
    headroomFloor: 0.2

- id: learn
  name: './packages/rlm-learn/src/index.ts'
  config:
    reflectInterval: 60000
    maxLearningsBeforeReflect: 10

- id: gitpixel
  name: './packages/rlm-gitpixel/src/index.ts'
  config:
    cwd: .
    warmOnStart: true

# ─── Agent ───────────────────────────────────────────────────────────────────

- id: agent
  name: './packages/rlm-agent/src/index.ts'
  config:
    cwd: .

# ─── Presentation ────────────────────────────────────────────────────────────

- id: renderer
  name: './packages/rlm-tui-renderer/src/index.ts'
  config:
    cwd: .

- id: print
  name: './packages/rlm-print/src/index.ts'
  config:
    cwd: .

- id: sdk
  name: './packages/rlm-sdk/src/index.ts'
  config:
    maxDepth: 10
    defaultModel: auto/best-free

# Which face rlm shows for this invocation. Last, because a mode runs the rows
# above it and there is nothing to run until they are there. The host asks this
# row what to do and does it; that is the whole of `main()` now.

- id: modes
  name: './packages/rlm-modes/src/index.ts'
