# rlm — the application, as data.
#
# This file IS rlm. Every capability is a row; there is no privileged core and
# no row that needs a restart to change. Load order comes from what each row
# injects, never from position here — position is for reading.
#
#   Recording      log
#   Boot           boot                    where things are, the overlay, shutdown
#   Reload         timer, hmr, rlm-hmr
#   Foundation     config, context, tui, prompt
#   Self-extension compose, plugins, self  rlm's hands on this file
#   Core           session, tools, refine, code, workflow, learn, pixel
#   Agent          agent                   the LLM loop
#   Presentation   renderer, print, sdk, modes
#
# The user's overlay is `~/.rlm/cordis.patch.yml`, layered over this file by the
# `boot` row and re-applied whenever it changes. Everything rlm decides about
# itself is written there and nowhere else, so `git diff` on this file only ever
# shows what a person did, and deleting the overlay returns rlm to stock.
#
# ## Hot reload, accurately
#
# `fiber.restart()` is NOT the mechanism, and three places in this repo used to
# say it was. It re-runs the plugin callback against the *cached* module, so a
# source edit has no effect. What actually happens is
# `registry.delete(oldPlugin)` followed by `registry.plugin(newPlugin,
# oldFiber._config)` for each live fiber, after the changed modules and
# everything downstream of them have been evicted from Node's ESM load cache.
# `@deepseek-ai/cordis-plugin-hmr` does that; `rlm-hmr` adds what it does not —
# watching the resource directories (skills, extensions, prompts, workflows)
# that live outside the module graph, and translating a reload into the events a
# live AgentSession listens for.
#
# Two fibers of one row therefore coexist for as long as the old disposer takes.
# That is what lets in-flight work finish, and it is why anything singleton — a
# port, a lock, a sidecar — has to be acquired inside `ctx.effect()`.

# ─── Recording ───────────────────────────────────────────────────────────────
#
# First row of all: everything after it can be explained from the log, and a
# failure during boot is exactly the one you cannot reproduce on demand.

- id: log
  name: './packages/rlm-log/src/index.ts'
  config:
    level: info

# ─── Boot ────────────────────────────────────────────────────────────────────
#
# Second, because everything below it wants to know where the repo and the
# home directory are, and because the overlay it layers on top of this file has
# to be in place before rows start reading their own config. `cordis-shell.mjs`
# used to do all of this; a bug in any of it therefore cost a restart, which is
# the one thing rlm is not allowed to need in order to change itself.

- id: boot
  name: './packages/rlm-boot/src/index.ts'

# ─── Who is watching ─────────────────────────────────────────────────────────
#
# Some rows below exist for a person sitting at a terminal, and this row is
# what decides whether there is one. It publishes that verdict as `rlmHeadless`
# and hands out `rlmLive` while somebody is watching, so a `--print` child —
# fifteen seconds long, one question, no terminal — never opens a file watcher
# it will not live long enough to use.
#
# **This row is an opinion, and removing it removes the opinion.** No row here
# names `rlmLive` in an `inject` any more, and that is deliberate: an injected
# token that nothing provides parks its row for ever, so deleting this entry
# used to leave `hmr`, `rlm-hmr`, `tui` and `renderer` all PENDING — hot reload
# and the renderer silently off, in a composition that never mentions
# headlessness. Take this row out now and rlm boots exactly as it did before
# the row existed: everything mounted, everything in the foreground.
#
# The expensive rows ask instead of being told, through `whenWatched()` in
# `packages/rlm-hmr/src/live.ts`. It probes `rlmHeadless` from inside a child
# fiber that waits on `loader` with `await: true`, so the question is asked
# after the composition has settled and before anything is opened — which is
# what the concurrent `Promise.allSettled` mount made impossible for a plain
# probe in `apply`. Nothing is opened and then closed.
#
# `rlm rows` therefore shows these rows ACTIVE in a headless run; what is left
# out is inside them. `rlmHeadless.explain()` is what names it, from the rows'
# own reports rather than from a fiber state.

- id: headless
  name: './packages/rlm-headless/src/index.ts'

# ─── Reload ──────────────────────────────────────────────────────────────────
#
# First rows on purpose: reload is itself a fiber, so editing a plugin reloads
# it. `hmr` is the upstream plugin DSH declares in its own base composition —
# it traces Node's module graph, clears the affected caches and swaps only the
# plugin entries that depend on what changed. `rlm-hmr` adds the two things it
# does not do: it watches the agent's resource directories (skills, extensions,
# prompts, workflows live outside the repo and are not modules) and translates
# reload announcements into the events a live AgentSession listens for. With no
# official plugin present — under bun, or without --expose-internals — rlm-hmr
# reloads modules itself instead.
#
# Both stand down when nobody is watching, and `hmr` is the expensive one:
# chokidar cannot resolve `fsevents` in this repo, so it falls back to one
# `fs.watch` per file and holds ~1,283 open descriptors over `packages/` —
# every README, CHANGELOG, PNG and .pyc included — all of them stat'd and
# opened before the first token is asked for. Nothing edits a file during a
# fifteen-second answer. Measured on this composition: 1,327 open descriptors
# watching, 26 not.
#
# `rlm-hmr` has to stand down alongside it and not on its own: in `auto` mode
# it watches the package roots *itself* whether or not the official plugin is
# there, so standing only `hmr` down would move the cost rather than remove it.
#
# `hmr` is a package and cannot be taught to ask the question, so it is reached
# through `./packages/rlm-hmr/src/official.ts` — a row that always mounts, costs
# nothing, and mounts the real plugin as a child fiber once the verdict is in.
# The plugin still provides the `hmr` service from there, which is what
# `rlm-hmr` probes to decide whether to bridge or reload modules itself.

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: hmr
  name: './packages/rlm-hmr/src/official.ts'
  config:
    root: ['packages']
    # packages/rlm-host reloads itself (shell.ts adopts the live Context);
    # a second reloader re-importing it could re-run the bootstrap.
    ignored: ['**/node_modules', '**/dist', '**/.*', '**/rlm-host/**']
    debounce: 100

- id: rlm-hmr
  name: './packages/rlm-hmr/src/index.ts'
  config:
    roots: ['packages']
    ignored: ['/packages/rlm-host/']
    debounce: 100

# ─── Foundation ──────────────────────────────────────────────────────────────

- id: config
  name: './packages/rlm-config/src/index.ts'
  config:
    cwd: .

- id: context
  name: './packages/rlm-context/src/index.ts'
  config:
    projectRoot: .

# Panels, spinners and key handling, for a terminal a one-shot answer does not
# have. Reached from a code cell as `tui.*` through a `globalThis` proxy.
#
# No gate, on measurement: this row's entire mount is one `globalThis`
# assignment and a log line — every panel it can draw is created on demand. It
# used to be parked in a headless run, which bought nothing and cost the code
# cell its `tui.*` handle.
- id: tui
  name: './packages/rlm-tui/src/index.ts'

- id: prompt
  name: './packages/rlm-prompt/src/index.ts'

# ─── Self-extension ──────────────────────────────────────────────────────────
#
# The three rows that make this file writable by the thing it composes.
# `compose` reads the composition and writes the overlay; `plugins` scaffolds a
# package, mounts it, and refuses to call a row that did not start "mounted";
# `self` is the seam that puts both in reach of a code cell, as `self.*`.
#
# They are three rows and not one because the capability and the surface it is
# offered through are different concerns: a second surface (a slash command, a
# socket) is a new row beside `self`, not an edit to `plugins`.

- id: compose
  name: './packages/rlm-compose/src/index.ts'

- id: plugins
  name: './packages/rlm-plugins/src/index.ts'
  config:
    staleAfterMinutes: 30
    rollbackOnFailure: true
    mountTimeout: 4000

- id: self
  name: './packages/rlm-self/src/index.ts'

# ─── Core ────────────────────────────────────────────────────────────────────

- id: session
  name: './packages/rlm-session/src/index.ts'

- id: tools
  name: './packages/rlm-tools/src/index.ts'
  config:
    timeout: 60000
    maxOutputChars: 65536

- id: refine
  name: './packages/rlm-refine/src/index.ts'

- id: code
  name: './packages/rlm-code/src/index.ts'
  config:
    timeout: 60000
    maxOutputChars: 65536

- id: workflow
  name: './packages/rlm-workflow/src/index.ts'
  config:
    workflowsDir: ~/.rlm/agent/workflows

# The delegation loop's memory. Above `workflow` in reading order because the
# workflow that does the delegating asks this row for the list first: what was
# asked is written down before any of it is attempted, and it is still written
# down after the process that was attempting it has gone. Load order still comes
# from `inject` — this row injects nothing, so it is up early either way.
#
# It also contributes two prompt fragments, both read from disk when the prompt
# is built rather than at mount: what is still owed, and the current source of
# the delegator workflow itself.
- id: delegate
  name: './packages/rlm-delegate/src/index.ts'

# rlm's own agent, over HTTP, for callers that are not rlm.
#
# Iris is the one this exists for: she contains no AI, so a skill that needs a
# model or a job done asks this row instead of holding a provider key. It routes
# `/v1/chat/completions` through rlm's model registry and hands `/v1/delegate`
# to the row above, which records the job in a durable journal before anybody
# runs it — so a caller that hangs up does not lose the work.
#
# 20130 and not 20129: the account provisioner already owns 20129 on this
# machine, and two services that both believe they own a port is a bind error at
# boot for whichever loses the race.
- id: integration
  name: './packages/rlm-integration/src/index.ts'
  config:
    port: 20130
    # `loopback`, not `localhost`. `localhost` is a name with two addresses
    # behind it and node binds only the one the resolver hands back first —
    # measured here as `::1` alone, which left `127.0.0.1` refusing connections
    # while `localhost` worked, so the seam was one resolver order away from
    # reading as "rlm is down". `loopback` opens a socket on each, and neither
    # is reachable off this machine.
    host: loopback
    enabled: true

# The row that keeps the fleet from editing the thing that bounds the fleet.
#
# `capacity()` in the delegate row decides how many children may run at once,
# and it reads that off the machine rather than from a setting. Every child is
# an rlm with a `code` tool, so without this row a task that will not start can
# be "fixed" by raising the ceiling that stopped it — which is how the laptop
# hosting the fleet dies.
#
# Two layers, and both are in the row rather than bolted into what they defend:
# a `tool_call` handler that refuses a cell writing a protected path, and a
# watcher that puts back an unauthorised change however it got there.
#
# `protect` extends the list; it cannot shorten it. The guard's own source is
# protected whatever is written here, because otherwise the shortest way through
# the door is to edit the door. This file is not: rlm writes to itself and hot
# reloads at runtime (Abhi, 2026-09-26), so deleting this row is possible — see
# the header of packages/rlm-guard/src/index.ts.
#
# Above `learn` in reading order only. Load order comes from `inject`.
- id: guard
  name: './packages/rlm-guard/src/index.ts'
  config:
    cwd: .
    protect:
      - 'packages/rlm-delegate/src/capacity.ts'
    restore: true
    debounceMs: 400
    unlockMaxMinutes: 60

- id: learn
  name: './packages/rlm-learn/src/index.ts'
  config:
    reflectInterval: 60000
    maxLearningsBeforeReflect: 10

- id: pixel
  name: './packages/rlm-pixel/src/index.ts'
  config:
    cwd: .
    warmOnStart: true

# Thinking rendered as steps — collapsed / summary / expanded (Alt+T, or
# `/thinking-steps`). pi-thinking-steps v1.0.11 as a row: loaded natively so its
# patch reaches the AssistantMessageComponent the TUI actually renders with.
- id: thinking-steps
  name: './packages/rlm-thinking-steps/src/row.ts'

# Claude / Codex / Gemini subscriptions, served by CLIProxyAPI (launchd
# `com.abhi.cliproxyapi`, config ~/.cli-proxy-api/config.yaml) and offered as
# the `cliproxy` provider. The set follows what CLIProxyAPI lists, live; add a
# subscription with `cliproxyapi -config ~/.cli-proxy-api/config.yaml -claude-login`.
- id: cliproxy
  name: './packages/rlm-cliproxy/src/index.ts'
  config:
    baseUrl: http://127.0.0.1:8317
    apiKeyFile: ~/.cli-proxy-api/rlm-api-key
    refreshMs: 60000


# ─── Agent ───────────────────────────────────────────────────────────────────

- id: agent
  name: './packages/rlm-agent/src/index.ts'
  config:
# This row *is* the interactive surface, and it is already gated by being one:
# everything expensive lives behind `start()`, which only the `interactive`
# mode calls, and that mode cannot be reached in a run nobody is watching —
# `--headless` implies `--print`. `[Service.init]` only subscribes to events.
#
# So it is not parked either. Parking never saved the one cost it does pay, a
# static import of the theme module, because the loader has to import a row's
# module to find the plugin object even when the fiber then parks for ever.
- id: renderer
  name: './packages/rlm-tui-renderer/src/index.ts'
  config:
    cwd: .

- id: print
  name: './packages/rlm-print/src/index.ts'
  config:
    cwd: .

- id: sdk
  name: './packages/rlm-sdk/src/index.ts'
  config:
    maxDepth: 10
    defaultModel: auto/best-free

# Which face rlm shows for this invocation. Last, because a mode runs the rows
# above it and there is nothing to run until they are there. The host asks this
# row what to do and does it; that is the whole of `main()` now.

- id: modes
  name: './packages/rlm-modes/src/index.ts'

