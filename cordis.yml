# rlm profile — Cordis entry-list composing all plugins.
#
# Fourteen plugins, ALL hot-swappable via fiber.restart():
#
#   Foundation layer (no dependencies):
#     1. config  — settings, model registry, auth storage
#     2. context — persistent typed variable registry (agent working memory)
#     3. tui     — TUI extension service (slash commands, components)
#     4. prompt  — prompt contribution registry (system-prompt fragments)
#
#   Core layer (depends on foundation):
#     5. session — session manager + persistence
#     6. tools   — tool registry (code, edit)
#     7. refine  — refinement + auto-refine
#     8. code    — persistent JS code execution (replaces bash + edit)
#     9. workflow — hot-swappable TS workflows from ~/.rlm/agent/workflows/
#    10. learn   — self-evolution (tracks outcomes, proposes modifications)
#    10b. gitpixel — deterministic gitpixel substitution on every code tool call
#
#   Agent layer (depends on core):
#    11. agent   — AgentSession (the LLM loop, tool dispatch, subagent spawning)
#
#   Presentation layer (depends on agent):
#    12. renderer — InteractiveMode (terminal rendering, input handling)
#    13. print    — Print mode (single-shot prompt → output → exit)
#    14. sdk      — in-process subagent spawning (wraps agent service)
#
# Dependency order: config → context/tui/prompt → session/tools/refine/code/workflow/learn
#                   → agent → renderer/sdk
#
# HMR: editing ANY plugin source triggers fiber.restart() on that plugin.
#      Active work continues on old fiber; new work uses reloaded plugin.

# ─── Recording ───────────────────────────────────────────────────────────────
#
# First row of all: everything after it can be explained from the log, and a
# failure during boot is exactly the one you cannot reproduce on demand.

- id: log
  name: './packages/rlm-log/src/index.ts'
  config:
    level: info

# ─── Reload ──────────────────────────────────────────────────────────────────
#
# First rows on purpose: reload is itself a fiber, so editing a plugin reloads
# it. `hmr` is the upstream plugin DSH declares in its own base composition —
# it traces Node's module graph, clears the affected caches and swaps only the
# plugin entries that depend on what changed. `rlm-hmr` adds the two things it
# does not do: it watches the agent's resource directories (skills, extensions,
# prompts, workflows live outside the repo and are not modules) and translates
# reload announcements into the events a live AgentSession listens for. With no
# official plugin present — under bun, or without --expose-internals — rlm-hmr
# reloads modules itself instead.

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  config:
    root: ['packages']
    ignored: ['**/node_modules', '**/dist', '**/.*']
    debounce: 100

- id: rlm-hmr
  name: './packages/rlm-hmr/src/index.ts'
  config:
    roots: ['packages']
    debounce: 100

# ─── Foundation ──────────────────────────────────────────────────────────────

- id: config
  name: './packages/rlm-config/src/index.ts'
  config:
    cwd: .

- id: context
  name: './packages/rlm-context/src/index.ts'
  config:
    projectRoot: .

- id: tui
  name: './packages/rlm-tui/src/index.ts'

- id: prompt
  name: './packages/rlm-prompt/src/index.ts'

# ─── Core ────────────────────────────────────────────────────────────────────

- id: session
  name: './packages/rlm-session/src/index.ts'

- id: tools
  name: './packages/rlm-tools/src/index.ts'
  config:
    timeout: 60000
    maxOutputChars: 65536

- id: refine
  name: './packages/rlm-refine/src/index.ts'

- id: code
  name: './packages/rlm-code/src/index.ts'
  config:
    timeout: 60000
    maxOutputChars: 65536

- id: workflow
  name: './packages/rlm-workflow/src/index.ts'
  config:
    workflowsDir: ~/.rlm/agent/workflows

- id: learn
  name: './packages/rlm-learn/src/index.ts'
  config:
    reflectInterval: 60000
    maxLearningsBeforeReflect: 10

- id: gitpixel
  name: './packages/rlm-gitpixel/src/index.ts'
  config:
    cwd: .
    warmOnStart: true

# ─── Agent ───────────────────────────────────────────────────────────────────

- id: agent
  name: './packages/rlm-agent/src/index.ts'
  config:
    cwd: .

# ─── Presentation ────────────────────────────────────────────────────────────

- id: renderer
  name: './packages/rlm-tui-renderer/src/index.ts'
  config:
    cwd: .

- id: print
  name: './packages/rlm-print/src/index.ts'
  config:
    cwd: .

- id: sdk
  name: './packages/rlm-sdk/src/index.ts'
  config:
    maxDepth: 10
    defaultModel: auto/best-free
